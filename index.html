<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تحدي اليوم (40) - أ/ عبدالعزيز الفيفي</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <style>
        :root { --primary: #1a237e; --secondary: #311b92; --bg: #f8f9fa; --accent: #f57c00; --correct: #1b5e20; --wrong: #b71c1c; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: var(--bg); display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .quiz-container { background: white; padding: 2.5rem; border-radius: 20px; box-shadow: 0 15px 35px rgba(0,0,0,0.15); width: 95%; max-width: 700px; text-align: center; position: relative; border-top: 8px solid var(--primary); }
        #timer-bar { position: absolute; top: 0; right: 0; height: 8px; background: var(--accent); width: 100%; transition: width 1s linear; border-radius: 20px 20px 0 0; }
        .option-btn { display: block; width: 100%; padding: 14px; margin: 12px 0; border: 2px solid #e0e0e0; border-radius: 10px; background: #fff; cursor: pointer; transition: all 0.3s ease; font-size: 1.1rem; font-weight: 500; color: #333; text-align: right; }
        .option-btn:hover { border-color: var(--secondary); background-color: #f3e5f5; }
        .correct-flash { background-color: #e8f5e9 !important; border-color: var(--correct) !important; color: var(--correct); border-width: 3px !important; }
        .wrong-flash { background-color: #ffebee !important; border-color: var(--wrong) !important; color: var(--wrong); }
        .hidden { display: none; }
        .reading-text { background: #fffde7; padding: 20px; border-radius: 10px; margin-bottom: 20px; text-align: right; font-size: 1.05rem; border-right: 6px solid var(--accent); line-height: 1.8; color: #444; }
        input[type="text"] { width: 85%; padding: 15px; margin-bottom: 25px; border-radius: 10px; border: 2px solid #ddd; font-size: 1.1rem; text-align: center; outline: none; }
        .btn-start { background: linear-gradient(135deg, var(--primary), var(--secondary)); color: white; padding: 15px 40px; border: none; border-radius: 12px; cursor: pointer; font-size: 1.2rem; font-weight: bold; }
        #feedback { margin-top: 20px; font-weight: bold; font-size: 1.2rem; min-height: 1.6em; }
        #timer-text { font-weight: bold; color: var(--wrong); margin-bottom: 15px; }
        .copyright { font-size: 0.9rem; color: #777; margin-top: 30px; border-top: 1px solid #eee; padding-top: 15px; }
        .date-badge { background: #eee; color: var(--wrong); padding: 5px 15px; border-radius: 20px; font-size: 0.9rem; font-weight: bold; margin-bottom: 15px; display: inline-block; }
    </style>
</head>
<body onload="updateDateTime()">

<div class="quiz-container">
    <div id="timer-bar"></div>
    
    <div id="login-section">
        <h1 style="color: var(--primary);">تحدي اليوم ( 40 ) ☁️</h1>
        <div id="date-display" class="date-badge">جاري التحميل...</div>
        <p>نموذج مربوط بالسحابة - 20 سؤالاً 🚀</p>
        <input type="text" id="student-name" placeholder="أدخل اسمك الثلاثي للبدء...">
        <br>
        <button class="btn-start" onclick="startQuiz()">ابدأ الاختبار الآن</button>
        <div class="copyright">أ/ <span style="color:#000">عبدالعزيز الفيفي</span> - <span style="color:#000">ثانوية الأمير عبدالمجيد 🎓</span></div>
    </div>

    <div id="quiz-section" class="hidden">
        <div id="timer-text">⏳ المتبقي: 40 ثانية</div>
        <h3 id="question-title" style="color: var(--secondary); margin-bottom: 10px;"></h3>
        <div id="reading-container" class="reading-text hidden"></div>
        <h2 id="question-text" style="margin: 15px 0;"></h2>
        <div id="options-container"></div>
        <div id="feedback"></div>
        <div class="copyright">أ/ <span style="color:#000">عبدالعزيز الفيفي</span> - <span style="color:#000">ثانوية الأمير عبدالمجيد 🎓</span></div>
    </div>

    <div id="result-section" class="hidden">
        <h2 style="color: var(--primary);">تم الحفظ في السحابة بنجاح ✅</h2>
        <h1 id="final-score" style="font-size: 3.5rem; color: var(--accent); margin: 20px 0;"></h1>
        <button class="btn-start" onclick="location.reload()">أعد الكرة.. طور ذاتك 🔄</button>
        <p class="copyright">أ/ <span style="color:#000">عبدالعزيز الفيفي</span> - <span style="color:#000">ثانوية الأمير عبدالمجيد 🎓</span></p>
    </div>
</div>

<!-- Firebase SDKs -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyBkCO7FDQXd89YDf843J4_AtvEFvzzt-R0",
        authDomain: "aztlg-494c3.firebaseapp.com",
        projectId: "aztlg-494c3",
        storageBucket: "aztlg-494c3.firebasestorage.app",
        messagingSenderId: "597051893949",
        appId: "1:597051893949:web:de5554ac900317a92b2fd4"
    };
    
    if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
    const db = firebase.firestore();

    async function saveToCloud() {
        const studentName = document.getElementById('student-name').value;
        const dateStr = new Date().toLocaleDateString('ar-SA'); 

        try {
            await db.collection("student_results").add({
                name: studentName + " (" + dateStr + ")",
                score: score, 
                total: quizData.length,
                model_id: "تحدي اليوم 40", 
                time: firebase.firestore.FieldValue.serverTimestamp()
            });
            console.log("تم الحفظ بنجاح");
        } catch (e) {
            console.error("خطأ في السحابة:", e);
        }
    }

    function updateDateTime() {
        const today = new Date();
        const hijriOptions = { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric', calendar: 'islamic-umalqura', numberingSystem: 'arabic' };
        const gregOptions = { day: 'numeric', month: 'long', year: 'numeric', numberingSystem: 'arabic' };
        document.getElementById('date-display').innerText = `${new Intl.DateTimeFormat('ar-SA', hijriOptions).format(today)} | ${new Intl.DateTimeFormat('ar-SA', gregOptions).format(today)} م`;
    }

    let timeLeft = 40, timerInterval, currentQ = 0, score = 0;

    const rawData = [
        { type: "التناظر اللفظي", q: "ضجيج : سكون", options: ["خداع : رياء", "كدر : صفاء", "حرارة : نار", "ليل : ظلام"], correctText: "كدر : صفاء" },
        { type: "التناظر اللفظي", q: "فيافي : قفر", options: ["بيداء : فلات", "مدن : عمران", "بحار : عمق", "نجوم : ضياء"], correctText: "بيداء : فلات" },
        { type: "التناظر اللفظي", q: "أتون : حرارة", options: ["مروحة : هواء", "مذياع : صوت", "مصباح : وهج", "مطر : برودة"], correctText: "مصباح : وهج" },
        { type: "التناظر اللفظي", q: "حجة : برهان", options: ["خوف : ذعر", "قوة : شجاعة", "علم : فهم", "صمت : حديث"], correctText: "خوف : ذعر" },
        { type: "الخطأ في السياق", q: "إن طول العمر لا يقاس بالسنين، بل بما حققه الإنسان من فشل في حياته يخلد ذكره", options: ["العمر", "بالسنين", "حققه", "فشل"], correctText: "فشل" },
        { type: "الخطأ في السياق", q: "عظمة عقلك تخلق لك الحساد، وعظمة قلبك تخلق لك الأعداء الذين يحبونك", options: ["عظمة", "الحساد", "الأعداء", "يحبونك"], correctText: "الأعداء" },
        { type: "الخطأ في السياق", q: "الابتسامة هي الجسر الأقصر بين القلوب، وهي أقوى وسيلة لتبديد المحبة بين الناس", options: ["الجسر", "القلوب", "تبديد", "المحبة"], correctText: "المحبة" },
        { type: "الخطأ في السياق", q: "المتواضع من إذا رأى من هو دونه في العلم قال: هذا أوتي أقل مما أوتيت أنا فربما هو أفضل", options: ["المتواضع", "دونه", "أقل", "أفضل"], correctText: "أقل" },
        { type: "إكمال الجمل", q: "من أراد حلاوة ..... فليصبر على مرارة .....", options: ["العسل - اللسع", "النجاح - الفشل", "الراحة - السهر", "الفوز - التعب"], correctText: "العسل - اللسع" },
        { type: "إكمال الجمل", q: "يعد ..... من أهم وسائل التفاهم بين الشعوب، وبدونه تسود .....", options: ["الحوار - الفوضى", "المال - التجارة", "العلم - الجهل", "السفر - الغربة"], correctText: "الحوار - الفوضى" },
        { type: "إكمال الجمل", q: "من زاد حبه لنفسه زاد ..... الناس له", options: ["جفاء", "تقدير", "احترام", "قرب"], correctText: "جفاء" },
        { type: "إكمال الجمل", q: "إن الرقابة ..... نابعة من الوجدان لا من خوف العقاب الخارجي", options: ["الذاتية", "الأسرية", "الدولية", "القانونية"], correctText: "الذاتية" },
        { type: "المفردة الشاذة", q: "ما الكلمة المختلفة؟", options: ["القسط", "العدل", "الإنصاف", "الظلم"], correctText: "الظلم" },
        { type: "المفردة الشاذة", q: "ما الكلمة المختلفة؟", options: ["الذهب", "الفضة", "الماس", "النحاس"], correctText: "الماس" },
        { type: "المفردة الشاذة", q: "ما الكلمة المختلفة؟", options: ["الجمعة", "السبت", "الأحد", "الاثنين"], correctText: "الجمعة" },
        { type: "المفردة الشاذة", q: "ما الكلمة المختلفة؟", options: ["الخشب", "الحديد", "الألمنيوم", "النحاس"], correctText: "الخشب" },
        { type: "استيعاب المقروء", text: "تعتبر (المياه الافتراضية) أداة استراتيجية لتقدير حجم المياه المستهلكة في إنتاج السلع.", q: "الهدف الجوهري من مفهوم المياه الافتراضية هو:", options: ["ترشيد استهلاك المياه القومي", "زيادة صادرات القمح", "حساب تكلفة النقل", "تحديد أسعار السلع"], correctText: "ترشيد استهلاك المياه القومي" },
        { type: "استيعاب المقروء", text: "البرمجيات المفتوحة المصدر تتيح للمطورين التعاون في تحسين الأكواد.", q: "المحرك الأساسي للابتكار فيها هو:", options: ["التعاون الجماعي", "الربح المادي", "التنافس التجاري", "حماية الملكية"], correctText: "التعاون الجماعي" },
        { type: "استيعاب المقروء", text: "الذاكرة العاملة تخزن المعلومات لفترة وجيزة جداً.", q: "علاقتها بالذاكرة طويلة الأمد هي علاقة:", options: ["مرحلية تمهيدية", "تضادية عكسية", "تطابق وظيفي", "استقلالية تامة"], correctText: "مرحلية تمهيدية" },
        { type: "استيعاب المقروء", text: "الغيوم الركامية تنشأ نتيجة تيارات هوائية صاعدة قوية.", q: "الصفة التي تجعلها مرتبطة بالعواصف هي:", options: ["التيارات الصاعدة", "لونها الأبيض", "قواعدها المرتفعة", "شكلها الجبلي"], correctText: "التيارات الصاعدة" }
    ];

    let quizData = [];
    function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

    function startQuiz() {
        if (!document.getElementById('student-name').value) { alert("لطفاً، ادخل اسمك الثلاثي"); return; }
        quizData = shuffle([...rawData]);
        document.getElementById('login-section').classList.add('hidden');
        document.getElementById('quiz-section').classList.remove('hidden');
        showQuestion();
    }

    function showQuestion() {
        const q = quizData[currentQ];
        document.getElementById('question-title').innerText = `س ${currentQ + 1} | ${q.type}`;
        const readingBox = document.getElementById('reading-container');
        if (q.text) { readingBox.innerText = q.text; readingBox.classList.remove('hidden'); } else { readingBox.classList.add('hidden'); }
        document.getElementById('question-text').innerText = q.q;
        const container = document.getElementById('options-container');
        container.innerHTML = '';
        document.getElementById('feedback').innerText = '';
        shuffle([...q.options]).forEach(opt => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.innerText = opt;
            btn.onclick = () => checkAnswer(btn, opt === q.correctText, q.correctText);
            container.appendChild(btn);
        });
        startTimer();
    }

    function startTimer() {
        clearInterval(timerInterval);
        timeLeft = 40;
        updateTimerUI();
        timerInterval = setInterval(() => { timeLeft--; updateTimerUI(); if (timeLeft <= 0) { clearInterval(timerInterval); handleTimeout(); } }, 1000);
    }

    function updateTimerUI() {
        document.getElementById('timer-text').innerText = `⏳ المتبقي: ${timeLeft} ثانية`;
        document.getElementById('timer-bar').style.width = `${(timeLeft / 40) * 100}%`;
    }

    function checkAnswer(btn, isCorrect, correctText) {
        clearInterval(timerInterval);
        document.querySelectorAll('.option-btn').forEach(b => b.disabled = true);
        if (isCorrect) {
            score++;
            btn.classList.add('correct-flash');
            document.getElementById('feedback').innerHTML = "<span style='color:var(--correct)'>إجابة دقيقة! 🌟</span>";
            confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 } });
        } else {
            btn.classList.add('wrong-flash');
            document.querySelectorAll('.option-btn').forEach(b => { if (b.innerText === correctText) b.classList.add('correct-flash'); });
            document.getElementById('feedback').innerHTML = "<span style='color:var(--wrong)'>محاولة جيدة 💪</span>";
        }
        setTimeout(nextQuestion, 4000);
    }

    function handleTimeout() {
        document.querySelectorAll('.option-btn').forEach(b => { b.disabled = true; if (b.innerText === quizData[currentQ].correctText) b.classList.add('correct-flash'); });
        setTimeout(nextQuestion, 4000);
    }

    function nextQuestion() { currentQ++; if (currentQ < quizData.length) showQuestion(); else finishQuiz(); }
    
    function finishQuiz() {
        document.getElementById('quiz-section').classList.add('hidden');
        document.getElementById('result-section').classList.remove('hidden');
        document.getElementById('final-score').innerText = `${score} / ${quizData.length}`;

        // إرسال البيانات للسحابة تلقائياً
        saveToCloud(); 
    }
</script>
</body>
</html>
